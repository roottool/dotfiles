name: CI
run-name: '${{ github.workflow }} (${{ github.ref_name }}): ${{ github.event.pull_request.title }}'
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Declare default permissions as read only.
permissions: read-all

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: write
    outputs:
      markdown: ${{ steps.filter.outputs.markdown }}
      markdown_files: ${{ steps.filter.outputs.markdown_files }}
      shellscript: ${{ steps.filter.outputs.shellscript }}
      dprint: ${{ steps.filter.outputs.dprint }}
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Assign yourself to this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          ASSIGNEE: ${{ github.event.pull_request.user.login }}
        if: ${{ github.event.pull_request.user.type != 'Bot' && toJSON(github.event.pull_request.assignees) == '[]' }}
        run: gh pr edit $NUMBER --add-assignee $ASSIGNEE
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check diff targets by path filters
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          list-files: shell
          filters: |
            markdown:
              - '**/*.md'
            shellscript:
              - '**/*.sh'
              - '**/*.zsh'
              - 'dot_profile'
              - 'dot_zprofile'
              - 'dot_zsh*'
            dprint:
              - '**/*.md'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.toml'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [setup]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup shfmt
        if: ${{ needs.setup.outputs.shellscript == 'true' }}
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1
        with:
          shfmt-version: '3.13.1'
      - parallel:
          - name: Check formatting (shfmt)
            if: ${{ needs.setup.outputs.shellscript == 'true' }}
            run: find . -type f \( -name 'dot_profile' -o -name 'dot_z*' -o -name '*.sh' -o -name '*.zsh' \) | grep -Ev 'examples/*' | xargs shfmt -d
          - name: ShellCheck
            if: ${{ needs.setup.outputs.shellscript == 'true' }}
            run: find . -type f \( -name 'dot_profile' -o -name 'dot_z*' -o -name '*.sh' -o -name '*.zsh' \) | grep -Ev 'examples/*' | xargs shellcheck
          - name: Markdown lint
            if: ${{ needs.setup.outputs.markdown == 'true' }}
            uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
            with:
              globs: ${{ needs.setup.outputs.markdown_files }}
          - name: Check formatting (dprint)
            if: ${{ needs.setup.outputs.dprint == 'true' }}
            uses: dprint/check@9cb3a2b17a8e606d37aae341e49df3654933fc23 # v2.3

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dotfiles
        run: sh -c "$(curl -fsLS chezmoi.io/get)" -- init --source-path . --apply
      - name: Validate rendered mise config
        run: |
          test -f "$HOME/.config/mise/config.toml"
          python3 -c "import tomllib; tomllib.load(open('$HOME/.config/mise/config.toml', 'rb'))"

  gatekeeper:
    name: Merge Gatekeeper
    runs-on: ubuntu-slim
    timeout-minutes: 2
    needs: [test]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    steps:
      - run: exit 1
