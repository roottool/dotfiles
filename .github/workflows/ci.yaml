name: CI
run-name: '${{ github.workflow }} (${{ github.ref_name }}): ${{ github.event.pull_request.title }}'
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Declare default permissions as read only.
permissions: read-all

defaults:
  run:
    shell: bash

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: write
    outputs:
      markdown: ${{ steps.filter.outputs.markdown }}
      markdown_files: ${{ steps.filter.outputs.markdown_files }}
      shellscript: ${{ steps.filter.outputs.shellscript }}
      shellscript_files: ${{ steps.filter.outputs.shellscript }}
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Assign yourself to this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          ASSIGNEE: ${{ github.event.pull_request.user.login }}
        if: ${{ github.event.pull_request.user.type != 'Bot' && toJSON(github.event.pull_request.assignees) == '[]' }}
        run: gh pr edit $NUMBER --add-assignee $ASSIGNEE
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check diff targets by path filters
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          list-files: shell
          filters: |
            markdown:
              - '**/*.md'
            shellscript:
              - '**/*.sh'
              - '**/*.zsh'
              - 'dot_profile'
              - 'dot_zprofile'
              - 'dot_zsh*'
              - '!examples/*'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [setup]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup shfmt
        if: ${{ needs.setup.outputs.shellscript == 'true' }}
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1
        with:
          shfmt-version: "3.13.1"
      - parallel:
        - name: Check formatting (shfmt)
          if: ${{ needs.setup.outputs.shellscript == 'true' }}
          run: find . -type f \( -name 'dot_z*' -o -name '*.sh' -o -name '*.zsh' \) | grep -Ev 'examples/*' | xargs shfmt -d
        - name: ShellCheck
          if: ${{ needs.setup.outputs.shellscript == 'true' }}
          run: find . -type f \( -name 'dot_z*' -o -name '*.sh' -o -name '*.zsh' \) | grep -Ev 'examples/*' | xargs shellcheck
        - name: Markdown lint
          if: ${{ needs.setup.outputs.markdown == 'true' }}
          uses: DavidAnson/markdownlint-cli2-action@8de2aa07cae85fd17c0b35642db70cf5495f1d25 # v24.0.0
          with:
            globs: ${{ needs.setup.outputs.markdown_files }}

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install dotfiles
        run: sh -c "$(curl -fsLS chezmoi.io/get)" -- init --source-path . --apply

  gatekeeper:
    name: Merge Gatekeeper
    runs-on: ubuntu-slim
    timeout-minutes: 2
    needs: [test]
    if: ${{ !(failure() || contains(needs.*.result, 'cancelled')) }}
    steps:
      - name: Exit with success
        run: exit 0
